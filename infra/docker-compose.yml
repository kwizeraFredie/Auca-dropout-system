services:
  postgres:
    image: postgres:16-alpine
    container_name: auca-dropout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auca_dropout}
      POSTGRES_USER: ${POSTGRES_USER:-auca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auca} -d ${POSTGRES_DB:-auca_dropout}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auca-postgres-data:
